name: Musinsa Daily Crawler

on:
  schedule:
    # 매일 한국 시간 기준 아침 8시 (UTC 기준 밤 11시)에 자동 실행
    - cron: '0 23 * * *'
  workflow_dispatch: # 수동으로도 언제든 실행 버튼을 누를 수 있게 허용

# ⭐️ 이 부분을 jobs 바로 위에 추가해 주세요!
permissions:
  contents: write

jobs:
  run-crawler:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install selenium pandas

      - name: Run crawler script
        run: python crawler.py  # 위에서 만든 크롤링 파일명

      - name: Commit and push changes if data updated
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add musinsa_new_ranking_top100.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: Auto-update Musinsa ranking CSV data" && git push)